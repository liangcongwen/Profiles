<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>提醒 - 桌面签</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      font-family: 'Microsoft YaHei UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
      background: #fff;
      border: 1px solid #d0d7de;
      display: flex;
      flex-direction: column;
      user-select: none;
    }
    header {
      background: #4a90e2;
      color: #fff;
      padding: 7px 10px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      -webkit-app-region: drag;
    }
    header button { -webkit-app-region: no-drag; border: 0; background: none; color: #fff; cursor: pointer; font-size: 14px; }
    main { flex: 1; padding: 10px 12px; overflow: auto; }
    #text { font-size: 15px; color: #2c3e50; word-break: break-word; white-space: pre-wrap; line-height: 1.4; }
    #note { font-size: 12px; color: #8a97a6; margin-top: 4px; white-space: pre-wrap; }
    #time { font-size: 12px; color: #8a97a6; margin-top: 4px; }
    footer { display: flex; gap: 6px; padding: 8px 10px; border-top: 1px solid #eef0f2; align-items: center; }
    footer button, footer select {
      border: 1px solid #d0d7de;
      background: #f6f8fa;
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
    }
    footer .primary { background: #4a90e2; border-color: #4a90e2; color: #fff; }
    .grow { flex: 1; }
  </style>
</head>
<body>
  <header><span>⏰ 待办提醒</span><button id="close" title="关闭">✕</button></header>
  <main>
    <div id="text"></div>
    <div id="note"></div>
    <div id="time"></div>
  </main>
  <footer>
    <select id="mins" title="稍后提醒">
      <option value="5">5 分钟后</option>
      <option value="10" selected>10 分钟后</option>
      <option value="30">30 分钟后</option>
      <option value="60">1 小时后</option>
      <option value="180">3 小时后</option>
    </select>
    <button id="snooze">稍后提醒</button>
    <span class="grow"></span>
    <button id="open">查看</button>
    <button id="done" class="primary">完成</button>
  </footer>
  <script src="reminder.js"></script>
</body>
</html>
