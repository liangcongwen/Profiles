name: 打包 Windows 程序

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 运行测试
        run: python -m unittest discover -s tests -v
      - name: 打包 exe
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --noconfirm --onefile --windowed --name CaseTracker run.pyw
      - uses: actions/upload-artifact@v4
        with:
          name: CaseTracker-windows
          path: dist/CaseTracker.exe
